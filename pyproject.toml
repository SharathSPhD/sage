[project]
name = "sage-workspace"
version = "0.0.0"
description = "SAGE — Strategic Agent Game Engine (workspace root; the installable library is strataq)"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/strataq",
    "packages/strataq-client",
    "packages/strataq-bench",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pyyaml>=6.0",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]
# Greek letters, en-dashes and math symbols are deliberate throughout this
# project's prose (λ, α, ℛ, –); ambiguous-unicode lints would fight the docs.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# The dashboard generator embeds SVG and markdown template literals.
"docs/progress/generate.py" = ["E501"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["packages/strataq/tests", "packages/strataq-client/tests", "packages/strataq-bench/tests", "gates/tests", ".claude/hooks/tests"]
addopts = "-q"
