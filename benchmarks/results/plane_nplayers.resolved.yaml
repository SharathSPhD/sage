  n_justification: "400 games per cell, everywhere, in both kill-shots and both control\
    \ arms. The Spearman null SD at n = 400 is 1/sqrt(n-1) = 0.0501, so the 0.35 ceiling\
    \ sits 7.0 null-SD from zero and the percentile-bootstrap CI half-width near rho\
    \ = 0 is about 0.098. The consequence, stated before the run: a point estimate\
    \ at or below about 0.25 certifies HOLDS, a point estimate at or above about 0.45\
    \ certifies DIES, and rho_hi in roughly [0.25, 0.45] returns INDETERMINATE. That\
    \ is the honest resolving power of this design \u2014 it can detect a full recovery\
    \ of coupling and it cannot adjudicate a half-recovery, and the criteria are written\
    \ so a half-recovery reports as the third outcome instead of being absorbed into\
    \ either branch. n = 400 is 4x the F-0004/F-0007 design and 2x the R11 main arm,\
    \ and the first 100 games of every N = 2, m = 3 cell ARE the F-0004/F-0007 games\
    \ while the first 200 ARE the R11 main-arm games, so the anchors are exact re-executions\
    \ rather than fresh samples. COMPUTE, and why n is not larger: a timing probe\
    \ (wall-clock only; no correlation computed, run before this file was written)\
    \ measured 0.0123 s/game at N = 2 m = 3, 0.0439 at N = 3, 0.2412 at N = 4, and\
    \ 0.0238 / 0.0434 / 0.0710 at m = 4 / 5 / 6 with N = 2, all converged, with make_family's\
    \ constructed harmonic fraction exact to 1.1e-16 at every N. The registered design\
    \ is 40 distinct solved cells: kill-shot A main 3 N x 5 levels, kill-shot B main\
    \ 3 new m x 5 levels (the m = 3 row IS the N = 2 row of A and is computed once),\
    \ C1a 2 new N x 2 levels, C1b 3 new m x 2 levels \u2014 16000 games solved from\
    \ 12000 distinct source draws (the C1 arms re-scale draws the main arms already\
    \ made, which is what \"paired\" means), plus 2400 calibration draws that are\
    \ never solved. That is about 22-26 minutes of Spark wall-clock against a 45-minute\
    \ budget. Doubling to n = 800 would buy sqrt(2) on intervals already an order\
    \ of magnitude inside nothing \u2014 the ceiling margin is what is at stake, not\
    \ precision \u2014 and would leave no budget for the C1 arms. F-0022 names the\
    \ unpaired, unmatched control as R11's single biggest defect and registers re-running\
    \ it paired and matched as this programme's follow-up obligation; spending the\
    \ marginal compute on a real control rather than on a tighter interval is therefore\
    \ a deliberate, pre-registered choice and not a shortfall. n recorded in the artifact\
    \ is 16000 = distinct constructed games solved; the decomposition above is repeated\
    \ there, because R11's registered n was wrong in both directions (F-0022, red-team\
    \ O-3) and this one is written to be checkable.\n"
