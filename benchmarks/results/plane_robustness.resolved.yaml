  n_justification: "200 games per (m, alpha) cell in the main arm: 4 m-values x 5\
    \ levels x 200 = 4000 games, plus 800 in the D1 scale control (100/cell x 4 m\
    \ x 2 levels), 400 in the D2 lambda control and 400 solver re-solves in K3 \u2014\
    \ 5600 games solved in total. The Spearman null SD at n=200 is 1/sqrt(n-1) = 0.071,\
    \ so the survival ceiling 0.35 sits ~4.9 null-SD from zero, and the primary quantity\
    \ gap(m) \u2014 a difference of two independent rho estimates, SD ~ 0.100 \u2014\
    \ is resolved against a reference gap of ~1.24 at better than 12 SD, so the 50%\
    \ shrink threshold (a 0.62 change in gap) is ~6 SD away from the null of no change.\
    \ The criterion is therefore genuinely resolvable at this n rather than a coin\
    \ flip dressed as a threshold. n = 200 is chosen as 2x the F-0004 design with\
    \ the first 100 games of each m=3 cell IDENTICAL to that design, so the replication\
    \ anchor is exact while the primary statistics get a sqrt(2) tighter interval.\
    \ The K3 arms use exactly reference_n = 100 games because their criterion is a\
    \ PAIRED difference against the published reference numbers, which were computed\
    \ on precisely those 100 games; adding games there would break the pairing that\
    \ makes a 0.05 bar meaningful. The D1/D2 controls use 100/cell (null SD 0.100):\
    \ they are diagnostics reported with CIs, and D1's binding use is a VERDICT comparison,\
    \ which is robust to the wider interval in a way a point-estimate comparison would\
    \ not be. Compute is the binding constraint on going further: measured steady-state\
    \ cost is 0.044 s/game at m=3 rising to 0.275 s/game at m=6, so the full design\
    \ is ~15 minutes; doubling n again would buy a sqrt(2) on intervals that are already\
    \ an order of magnitude inside the registered thresholds.\n"
