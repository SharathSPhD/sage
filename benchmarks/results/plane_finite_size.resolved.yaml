  n_justification: "100 games per (m, alpha) cell, 4 m-values x 10 levels = 4000 games\
    \ in the main sweep plus 800 in the D1 scale control. The Spearman null SD at\
    \ n=100 is 1/sqrt(n-1) = 0.100, so the survival ceiling 0.35 sits 3.5 null-SD\
    \ from zero and the registered recovery delta 0.40 is ~2.8 SD of a DIFFERENCE\
    \ of two independent rho estimates (sqrt(2) x 0.100 = 0.142) \u2014 the primary\
    \ criterion is therefore resolvable at this n rather than being a coin flip dressed\
    \ as a threshold. n = 100 is not a free choice: it matches F-0004's design exactly,\
    \ which is what makes the m=3 row a replication and the m-sweep a paired comparison\
    \ against a known number rather than an isolated reading. The T3 bootstrap (2000\
    \ resamples) gives a percentile CI whose Monte-Carlo error is ~1/sqrt(2000) =\
    \ 2% of the CI width, negligible against the 0.14 sampling SD that criterion actually\
    \ contends with. Compute is the binding constraint on going further: per-game\
    \ cost is 0.04 s (m=3) to 0.26 s (m=6), so the full design is ~11 min and doubling\
    \ n would not change which criteria are resolvable, only their margins.\n"
