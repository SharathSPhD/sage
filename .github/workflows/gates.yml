name: Gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: gate regression check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages
      - name: Run gates (fail on regression of previously green units)
        run: uv run python gates/run_gates.py --check
