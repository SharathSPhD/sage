name: API image

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "packages/**"
      - "uv.lock"
      - ".github/workflows/api-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build linux/arm64 image
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/sharathsphd/sage-api:latest
            ghcr.io/sharathsphd/sage-api:${{ github.sha }}
