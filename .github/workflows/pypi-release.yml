name: pypi-release

# Publishes strataq to PyPI on a version tag (strataq-v*) using the
# PYPI_API_TOKEN repository secret (set 2026-08-12; the token itself never
# appears in the repo). To migrate to Trusted Publishing (OIDC) later, add
# this repo/workflow as a trusted publisher on pypi.org and swap the
# password step for `permissions: id-token: write` + the OIDC action.

on:
  push:
    tags: ["strataq-v*"]
  workflow_dispatch: # manual re-run (idempotent: already-uploaded files skip)

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build --package strataq --out-dir dist
      - name: Smoke-test the wheel
        # MUST exercise a SOLVER path, not just the pure-numpy one: the
        # 0.1.0 release found that an installed wheel could not run any
        # solver call (the packaged base.yaml was missing) — and the
        # numpy-only check passed straight through that defect.
        run: |
          uv venv /tmp/smoke && VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import strataq, strataq.toolkit as tk
          r = tk.reciprocity_read([[1.0, 0.2], [0.2, 0.9]])
          assert r.r < 1e-12, r
          g = tk.game_thermo([[[0.0, -1.0, 1.0], [1.0, 0.0, -1.0], [-1.0, 1.0, 0.0]],
                              [[0.0, 1.0, -1.0], [-1.0, 0.0, 1.0], [1.0, -1.0, 0.0]]])
          assert g.alpha > 0.9 and g.epr > 1e-3, g   # solver + config + dynamics
          print("wheel ok:", strataq.__version__, g.verdict)
          PY
      - name: Publish to PyPI
        env:
          UV_PUBLISH_USERNAME: __token__
          UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        # Idempotent by construction: a re-run or re-tag of an already-
        # published version must not fail the release. uv's --check-url
        # semantics differ across versions (0.11 tolerates the duplicate,
        # 0.12.3 errors), so the ONE benign error is matched explicitly and
        # everything else still fails the job. 0.1.0 was published by hand
        # when the PI supplied the token, which is how this path was found.
        run: |
          set +e
          out=$(uv publish --check-url https://pypi.org/simple/strataq/ dist/* 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then
            if echo "$out" | grep -q "File already exists"; then
              echo "::notice::this version is already on PyPI — nothing to upload"
              exit 0
            fi
            exit "$code"
          fi
