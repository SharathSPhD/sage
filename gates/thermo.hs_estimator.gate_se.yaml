# thermo.hs_estimator.gate_se (R9) — a split-independent SE for the
# relaxation gate. Claim filled from the registered run's adjudication.
unit: thermo.hs_estimator.gate_se
claim: "REFUSED as registered, and the refusal separates two failure modes R8 had fused (F-0020). (1) G1 order-invariance is SOLVED: jackknife, delta and bootstrap all give 0/20 anomaly-flag flips under the physically-null full trajectory permutation at n=30/50/100, against the incumbent split's 7/6/0 — R8's C-2 prediction confirmed. (2) G5 (SE accuracy against an oracle SE from 40 independent draws, own relative SE 0.113) discriminates as designed and bootstrap wins: 0.18-0.29 deviation vs split 0.44-0.49 and jackknife 0.32-0.52; delta fails catastrophically on ONE window (~1e8) because its dtau/drho gradient explodes at the rho clip floor. (3) G4 refusal power is clean for every candidate (60/60 at n=30 and n=100) — nothing bought agreement by breaking the gate. (4) G2 fails at n=30 for ALL candidates; bootstrap misses on that single cell alone (12/20 vs an 18 bar) with all four other criteria passed. The mechanism is that tau_hat's own across-seed SD is 0.967 at n=30 (35-40% of tau_hat), so an ACCURATE SE must refuse genuinely settled holds — the binding constraint is the variance of the relaxation-time ESTIMATE, not the error bar. This partially RETRACTS F-0019's extrapolation: stability was implementation-bound and is fixed, quotability is not and needs a lower-variance tau_hat. (5) Real data (R7 CAISO panel): flip rate 0.214 -> 0.050, month 06 collapsing 17/20 -> 0/20, and admission MOVES (month 07 refused under split, admitted under all alternatives) with the estimate provably identical. (6) A SECOND order-dependence found outside R9's scope: the CI/IFT bootstrap resamples indices from a fixed seed, so the whole residual is a thresholded-Monte-Carlo-boolean problem (R10). Default left at split per the letter of the registered rule, with the rule's gap — the incumbent fails three criteria while bootstrap fails one — put to the reviewer rather than resolved unilaterally"
tier: derived

gates:
  code:
    tests_pass: true
    coverage_min: 0.9
    types_clean: true
    lint_clean: true
    no_todo_no_stub: true
    paths:
      - packages/strataq/strataq/thermo/hs_estimator.py
      - packages/strataq/tests/thermo/test_hs_estimator.py

  domain:
    - id: gate_se_realdata
      spec: "the downstream obligation on REAL data: every candidate re-reads R7's CAISO monthly windows plus 20 physically-null day-order shuffles each, so instability is a measured RATE; also corrects R7's own one-draw design"
      artifact: benchmarks/results/gate_se_realdata.json
    - id: gate_se_reading
      spec: "registered G1-G5 evaluated for all four SE candidates on identical sampled data; the adopted method (or the refusal) follows from the thresholds, not from inspection after the fact"
      artifact: benchmarks/results/gate_se_read.json

  statistical:
    effect_sizes_reported: true
    confidence_intervals: true
    n_justified: true
    seeds_fixed_and_recorded: true

  documentation:
    files:
      - docs/reference.md
      - docs/instruments/dissipation.md
    claims_ledger_updated: true
    changelog_entry: true

  adversarial:
    # Red-team returned GRANTED-CONDITIONAL: no blocking objections, two
    # must-address conditions, three notes. Both conditions are resolved below
    # WITH MECHANISM rather than deferred, and condition 1's investigation
    # produced the unit's largest finding (F-0021). The reviewer independently
    # verified the bit-identical refactor, G5's discrimination against oracle
    # noise, G4's non-vacuity and the fairness of the F-0017 correction.
    red_team_signoff: true
    objections:
      - id: C-1
        text: "MUST-ADDRESS: jackknife's G5 deviation worsens monotonically with n (0.321 -> 0.433 -> 0.519 -> 0.654), which is backwards for a consistent estimator and is unexplained. Provide a mechanism or file as an open chase item"
        disposition: addressed
        where: "Resolved with a ROOT CAUSE, not a chase item (F-0021). Signed per-window ratios localise the failure to the pre-quench window, and the cause is upstream of every SE: at lag N/4 the autocorrelation has already decayed into noise, so rho is 0 or NEGATIVE there (-0.0185, -0.0033 at n=30, both clipped to the 1e-12 floor) and tau_hat returns a clip-floor artifact. One cause, three symptoms: delta explodes (gradient divides by rho), jackknife collapses to EXACTLY zero SE on 6/20 seeds at n=30 (clipped replicates all pin to one value), split on 2/20; bootstrap 0/20. Two characterisation tests encode it. Also forced a correction to my own first phrasing: the '6.7x understatement' was a ratio of medians, not a per-seed effect (per-seed median jack/boot ratio is 0.78, only ~60% of seeds below 1) -- the real failure is intermittent TOTAL collapse, which is worse. Sharpens R10 from 'lower-variance tau_hat' to 'adaptive lag + explicit refusal when rho is indistinguishable from zero'"
      - id: C-2
        text: "MUST-ADDRESS: the registered rule keeps `split` as default when nothing passes, but did not anticipate the incumbent failing three criteria while bootstrap fails one. Leaving a dominated default is questionable for users; confirm the decision or revise the rule"
        disposition: addressed
        where: "Resolved concretely, not by deference. The certified adjudication stands as registered (REFUSED, nothing adopted). The DEFAULT stays `split` for two stated reasons -- flipping it would silently change behaviour in a package already on PyPI, and would break reproduction of every recorded R7/R8 artifact -- but `bootstrap` is now the DOCUMENTED RECOMMENDATION in the docstring and docs/reference.md with the F-0021 evidence, so no user is quietly handed the worse instrument. R10 carries the default flip BUNDLED with its downstream re-run obligation so the behaviour change and artifact refresh land together. A standing RULE REVISION is recorded in config/experiments/gate_se.yaml: when the incumbent is strictly dominated, a unit must say so in its claim, document the recommended alternative with evidence, and register the default change as a named follow-up -- silence is not an acceptable outcome"
      - id: N-1
        text: "NOTE: the aggregate G2 mechanism over-predicts the refusal rate (~81% from a normal approximation vs ~40% observed), so the story is sound but simplified"
        disposition: addressed
        where: "Explained by the same F-0021 mechanism: the per-window behaviour is heterogeneous, with windows 0-2 degenerate-and-PERMISSIVE (tau_hat pinned tiny) and windows 3-5 carrying the actual decision, so an aggregate model mixing them necessarily mis-predicts. Recorded in F-0021"
      - id: N-2
        text: "NOTE: delta's gradient explosion at the rho clip floor is documented but its mechanism belongs in the main artifact, not only a side note"
        disposition: addressed
        where: "Promoted to F-0021 as one of three symptoms of a single root cause, with the gradient lag*dt/(rho ln^2 rho) written out, plus the docstring and reference-doc warnings"
      - id: N-3
        text: "NOTE: the month-05 residual (identical flip rate across all four SE methods) confirms a second order-dependence; appropriate as a chase item"
        disposition: accepted
        where: "Agreed and kept as R10. Mechanism verified directly (mean_y identical to six decimals under permutation while the IFT bound swings 0.970-1.246) and captured in TestIntervalOrderDependence so the fix cannot land silently"
      - id: SELF-1
        text: "SELF-IDENTIFIED, flagged to the reviewer before their report: G5 as registered stores only |ratio - 1|, so the DIRECTION of the error is not recoverable from the artifact -- a candidate that dangerously understates uncertainty scores identically to one that harmlessly overstates it"
        disposition: addressed
        where: "A real defect in my own criterion. Resolved by measuring the signed per-window ratios post-hoc, which is what exposed the understatement direction and hence F-0021 -- the very failure the criterion as written could not see. Future SE criteria must be signed"
      - id: SELF-2
        text: "SELF-IDENTIFIED: G1 is a THEOREM for jackknife and delta (permutation-invariance by construction), so passing it is arithmetic rather than evidence"
        disposition: addressed
        where: "Acknowledged in the config and the finding; compensated by the real-data flip-rate check on R7's CAISO panel, which is not arithmetic -- split 0.214 vs 0.050, Jeffreys intervals non-overlapping ([0.153, 0.288] vs [0.023, 0.096]). The reviewer judged this adequate"

