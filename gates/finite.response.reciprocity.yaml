unit: finite.response.reciprocity
claim: "reciprocity_defect reads 0 on exact potential games and rises with harmonic fraction"
tier: derived

gates:
  code:
    tests_pass: true
    coverage_min: 0.90
    types_clean: true
    lint_clean: true
    no_todo_no_stub: true
    paths:
      - packages/strataq/strataq/finite/response/tangent.py
      - packages/strataq/strataq/finite/response/susceptibility.py
      - packages/strataq/strataq/finite/response/reciprocity.py
      - packages/strataq/strataq/finite/response/spectral.py
      - packages/strataq/strataq/finite/decompose/kron.py
      - packages/strataq/strataq/finite/decompose/hodge.py
      - packages/strataq/strataq/finite/decompose/generate.py
      - packages/strataq/strataq/finite/games/tensor.py
      - packages/strataq/strataq/finite/games/normalise.py
      - packages/strataq/strataq/finite/games/library.py
      - packages/strataq/strataq/core/solve/fixedpoint.py
      - packages/strataq/strataq/core/types.py
      - packages/strataq/strataq/core/defaults.py
      - packages/strataq/tests/finite/test_solve.py
      - packages/strataq/tests/finite/test_response.py
      - packages/strataq/tests/finite/test_decompose.py

  domain:
    - id: potential_reads_zero
      spec: "R < 1e-10 on 5 verified exact potential games (congestion n=2/3, coordination x2, common-interest)"
      artifact: benchmarks/results/reciprocity_potential.json
    - id: harmonic_reads_positive
      spec: "R > 0.1 on pure harmonic games (RPS n=3/5, matching pennies)"
      artifact: benchmarks/results/reciprocity_harmonic.json
    - id: monotone_in_alpha
      spec: "Spearman rho(R, alpha) > 0.9, p < 0.01, over 200 sampled games per alpha level"
      artifact: benchmarks/results/reciprocity_alpha_sweep.json
    - id: oracle_agreement
      spec: "chi_eq matches finite-difference of logit_qre to 1e-6 on 50 random games"
      artifact: benchmarks/results/chi_fd_agreement.json
    - id: spectrum_reality
      spec: "SB spectrum effectively real (rel imag < 1e-8) on all potential games across lambda in 0.5..10; complex on harmonic games (N3)"
      artifact: benchmarks/results/spectrum_reality.json

  statistical:
    effect_sizes_reported: true
    confidence_intervals: true
    n_justified: true
    seeds_fixed_and_recorded: true

  documentation:
    files:
      - docs/instruments/reciprocity.md
      - apps/web/content/learn/07-reciprocity.mdx
    claims_ledger_updated: true
    changelog_entry: true

  adversarial:
    red_team_signoff: true    # granted 2026-08-08 verification pass: O-1..O-3 verified addressed, no new blocking defects
    objections:
      - id: O-1
        text: "'R is lambda-free' overstated: only the symmetry statement (R=0 iff potential) is lambda-free; the magnitude scales with lambda"
        disposition: addressed
        where: "docs/instruments/reciprocity.md and memory/claims.md N2 corrected; findings F-0002 records the probe (R ~ lambda on matching pennies) and the small-lambda mechanism"
      - id: O-2
        text: "monotone_in_alpha correlation could be confounded by lambda / game structure"
        disposition: addressed
        where: "The sweep holds lambda fixed at 1.2 (config), so lambda cannot drive rho; docs state this explicitly and scope the claim as rank-order evidence, naming RPS-3 vs RPS-5 as the structure effect at equal alpha"
      - id: O-3
        text: "N3 spectral verification was spot-checked in tests but not a regenerable gate artifact"
        disposition: addressed
        where: "New domain gate spectrum_reality + benchmarks/results/spectrum_reality.json generated by the calibration experiment across a lambda grid"
