# Gate spec schema, by annotated example. run_gates.py validates against this shape.
# This example is the programme's canonical first unit (Stage 1); it is a
# specification of what closure will mean, not a live gate yet.

unit: finite.response.reciprocity          # dotted unit id; file named <unit>.yaml
claim: "reciprocity_defect reads 0 on exact potential games and rises with harmonic fraction"
tier: derived                              # exact | derived | conjectured | speculative
# conjectured tier REQUIRES the falsifier field:
# falsifier: "R > 1e-6 on a verified exact potential game after tangent/normalisation audit"

gates:
  code:
    tests_pass: true                       # pytest on the unit's test paths
    coverage_min: 0.90                     # over the unit's modules
    types_clean: true                      # mypy strict
    lint_clean: true                       # ruff
    no_todo_no_stub: true                  # no TODO / NotImplementedError / pass-stub in unit paths
    paths:                                 # what "the unit" means on disk
      - packages/strataq/strataq/finite/response/reciprocity.py
      - packages/strataq/tests/finite/test_reciprocity.py

  domain:                                  # THE POINT OF THIS CONTRACT
    - id: potential_reads_zero
      spec: "R < 1e-10 on 5 verified exact potential games (congestion, coordination, common-interest)"
      artifact: benchmarks/results/reciprocity_potential.json
    - id: harmonic_reads_positive
      spec: "R > 0.1 on pure harmonic games (RPS family, n=3..5)"
      artifact: benchmarks/results/reciprocity_harmonic.json
    - id: monotone_in_alpha
      spec: "Spearman rho(R, alpha) > 0.9, p < 0.01, over 200 sampled games per alpha level"
      artifact: benchmarks/results/reciprocity_alpha_sweep.json
    - id: oracle_agreement
      spec: "chi_eq matches finite-difference of logit_qre to 1e-6 on 50 random games"
      artifact: benchmarks/results/chi_fd_agreement.json

  statistical:
    effect_sizes_reported: true            # checked inside the artifact JSONs
    confidence_intervals: true
    n_justified: true                      # n_justification non-empty in artifacts
    seeds_fixed_and_recorded: true         # seed non-null in artifacts

  documentation:
    api_docs: true
    files:
      - docs/instruments/reciprocity.md
      - apps/web/content/learn/07-reciprocity.mdx
    claims_ledger_updated: true
    changelog_entry: true

  adversarial:
    red_team_signoff: false                # set true only by red-team, via the adversarial-review skill
    objections: []                         # [{id, text, disposition: addressed|accepted, where}]
