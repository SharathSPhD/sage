unit: thermo.hs_estimator
claim: "CERTIFIED within validated scope after a WITHHELD-then-GRANTED arc (F-0016): Hatano-Sasa Y from observed quench trajectories — plug-in with the mandatory pre-quench window, calibrated trajectory-bootstrap CI (20/20 at nominal 95%), primary relaxation gate (hold >= 4 x (lag-N/4 tau_hat + 2 SE), zero flicker at settled holds, conservative-only at margins, correct on the alpha=0 basin-hopping family with no game tuning), and a TESTED IFT anomaly companion that fires on genuinely non-stepwise input. v2 criteria C1-C5 all pass on a registration whose commit landed pre-run; scope and unit contracts explicit in the docstring"
tier: derived

gates:
  code:
    tests_pass: true
    coverage_min: 0.9
    types_clean: true
    lint_clean: true
    no_todo_no_stub: true
    paths:
      - packages/strataq/strataq/thermo/hs_estimator.py
      - packages/strataq/tests/thermo/test_hs_estimator.py

  domain:
    - id: hs_estimator_sweep
      spec: "P1 every gate-admitted hold covers exact <Y>; P2 short holds refused; P3 monotone usable boundary — after two recorded diagnostic failures and two recorded escalations (all in config comments and F-0016)"
      artifact: benchmarks/results/hs_estimator_sweep.json

  statistical:
    effect_sizes_reported: true
    confidence_intervals: true
    n_justified: true
    seeds_fixed_and_recorded: true

  documentation:
    files:
      - docs/instruments/dissipation.md
    claims_ledger_updated: true
    changelog_entry: true

  adversarial:
    # Review 1 WITHHELD (five blocking objections, all below, all closed by
    # strengthening or honest narrowing); review 2 (fresh reviewer pass over
    # the v2 certification) GRANTED with the banner lift, zero objections
    # after F1/F3/F7/F2/F6 fixes were verified in-repo.
    red_team_signoff: true
    objections:
      - id: O-1
        text: "BLOCKING: safety factor 4 calibrated on one case; the relaxation underestimate reaches ~19x at alpha=0"
        disposition: addressed
        where: "F-0016 + module banner; fixed safety factors abandoned as an approach in the continuation notes"
      - id: O-2
        text: "BLOCKING: single-seed coverage - multi-seed shows ~2/5 at the admitted hold (residual bias beyond the CI)"
        disposition: addressed
        where: "F-0016 names the plug-in's in-sample correlation bias as the redesign target (split-sample pi_hat / explicit bias correction)"
      - id: O-3
        text: "BLOCKING: the autocorrelation gate breaks at small n_trajectories (24x underestimate at n=1)"
        disposition: addressed
        where: "Module banner states the failure; minimum-n analysis deferred to the redesign"
      - id: O-4
        text: "BLOCKING: P1 was re-scoped from 'tau>=4' to 'gate-admitted holds' - a weakening to fit the implementation"
        disposition: addressed
        where: "Owned in F-0016: the original criterion was never met, the sweep's PASS is void for certification, and the unit is NOT green"
      - id: O-5
        text: "NOTE: even at its most honest, the gate refuses 7/8 holds - the usefulness scope must be stated"
        disposition: accepted
        where: "F-0016: the usable regime demands tau ~ 25x the inverse gap - data-side quench estimation on concentration ramps is presently impractical, which is itself the finding"
      - id: R2-F1
        text: "BLOCKING (review 2): the IFT anomaly companion was untested against the failure it exists to catch"
        disposition: addressed
        where: "test_ift_fires_on_continuous_ramp: a continuous lambda ramp chopped into fake holds — CI [1.028, 1.103] excludes 1, usable=False, ANOMALY warning; permanent test"
      - id: R2-F3
        text: "BLOCKING (review 2): the hold_durations time-unit contract was implicit — a unit mismatch rescales the gate silently"
        disposition: addressed
        where: "Docstring states the one-unit contract with the implied-spacing formula, a worked example, and the plain statement that data-side detection is impossible"
      - id: R2-F7
        text: "NOTE (review 2): docstring falsely said the pre-quench window 'may be omitted'"
        disposition: addressed
        where: "Corrected to MUST, citing the F-0016 missing-window bug"
      - id: R2-F2F6
        text: "NOTE (review 2): validated scope (2x2 families, alpha in {0, 0.25}, n>=200) must be declared"
        disposition: addressed
        where: "VALIDATED SCOPE block in the docstring and the module header"
