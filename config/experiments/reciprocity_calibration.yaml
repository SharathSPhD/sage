# Reciprocity calibration — the finite.response.reciprocity domain-gate artifacts.
defaults:
  - _self_

seed: 20260808
lam: 1.2
solver:
  tol: 1.0e-12
  max_iter: 100000

potential_games:            # the "reads zero" panel (verified exact potential)
  n_congestion_players: [2, 3]
  n_coordination: 2

harmonic_games:             # the "reads positive" panel
  rps_sizes: [3, 5]
  include_matching_pennies: true

alpha_sweep:
  levels: [0.05, 0.15, 0.25, 0.35, 0.45, 0.55, 0.65, 0.75, 0.85, 0.95]
  games_per_level: 200      # n justified in the artifact: precision reasoning
  shape: [3, 3]
  scale: 2.0

fd_check:
  n_games: 50
  shape: [3, 3]
  payoff_scale: 0.5

bootstrap:
  n_resamples: 2000
