# Global invariants. Every experiment composes on top of this; no literal
# tolerance, seed, grid size or λ range may appear in library code — it comes
# from here (or a group override) through a typed schema (strataq.core.config).

defaults:
  - _self_

numerics:
  jax_enable_x64: true          # float32 is not acceptable near criticality
  dtype: float64

seeds:
  # Seed policy: every stochastic call site takes an explicit jax PRNG key
  # derived by fold_in from this root; resolved configs record the root.
  root: 20260808
  policy: explicit-key-threading

tolerances:
  # The tolerance ladder. Exact identities test at `identity`; solver
  # convergence at `solve`; finite-difference agreement at `fd`; oracle
  # cross-checks at `oracle`.
  identity: 1.0e-12
  decompose: 1.0e-10
  oracle: 1.0e-8
  fd: 1.0e-6
  solve: 1.0e-10

lambda_conventions:
  # Payoffs are rescaled to unit range internally; the scale folds into λ.
  # Both `lam` (user-facing) and `lambda_normalised = lam * payoff_range`
  # are always reported (PROGRAMME v3 §8.5).
  normalise_payoffs: true
  report_both: true

criticality:
  # Below this distance-to-criticality (1 - rho(SB)), warn rather than
  # silently returning a huge chi_eq.
  warn_below: 1.0e-3

solver:
  max_iter: 10000
  damping: 0.5

estimate:
  # λ-estimator family (PROGRAMME v3 §4): shared search window and honesty
  # thresholds. The window is on the user-facing lam scale.
  lam_min: 0.05
  lam_max: 20.0
  grid_points: 40
  refine_iters: 30
  profile_ci_drop: 1.92        # chi2(1) 95% two-sided, /2 (profile likelihood)
  flat_ll_per_obs: 1.0e-6      # LL range per observation (nats) below which lambda is unidentified
  flat_entropy_threshold: 1.0e-3  # model-entropy range (nats) below which dispersion is unidentified
  agreement_flag_gap: 0.25     # relative spread across estimators that flags misspecification
  bootstrap_resamples: 50

repeated:
  # Infinitely repeated games. `delta_max` brackets the bisection for the
  # critical discount factor; the cycle knobs bound the Edgeworth path search.
  delta_max: 0.999
  bisect_iters: 60
  cycle_max_steps: 400
  cycle_tol: 1.0e-6

evolutionary:
  # Replicator integration and the Moran chain. `mutation` keeps the finite
  # population chain ergodic so a stationary distribution exists at all.
  step: 0.01
  steps: 20000
  rest_tol: 1.0e-9
  mutation: 1.0e-3

extensive:
  # Game trees. `max_nodes` guards the dense backward/forward passes. The AQRE
  # map is not a contraction at high precision, so a run that misses tolerance
  # retries with `damping_backoff` times the damping, up to `max_restarts`
  # times, and then falls back to continuation in lambda over
  # `continuation_points` steps.
  max_nodes: 20000
  max_pure_strategies: 20000
  damping_backoff: 0.25
  max_restarts: 4
  continuation_points: 48

situation:
  # The sensitivity ladder solve_situation() sweeps, as multiples of the
  # precision the caller stated.
  ladder_points: 9
  ladder_low: 0.25
  ladder_high: 4.0
