[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strataq"
version = "0.1.0"
description = "Computational framework for stochastic strategic interaction: QRE, potential and non-potential games, entropy-regularised response, non-equilibrium strategic dynamics."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Sharath Sathish" }]
keywords = ["game-theory", "quantal-response-equilibrium", "jax", "non-equilibrium", "thermodynamics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "jax>=0.4.30",
    "equinox>=0.11",
    "optimistix>=0.0.9",
    "lineax>=0.0.6",
    "optax>=0.2",
    "numpy>=1.26",
    "polars>=1.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
gambit = ["pygambit>=16.2"]
blp = ["pyblp>=1.1"]
dreamprice = ["datasets>=2.19", "huggingface-hub>=0.23"]
bayes = ["numpyro>=0.15"]
viz = ["matplotlib>=3.8"]
all = ["strataq[gambit,blp,dreamprice,bayes,viz]"]

[project.urls]
Repository = "https://github.com/SharathSPhD/sage"

[tool.hatch.build.targets.wheel]
packages = ["strataq"]
artifacts = ["strataq/py.typed"]
