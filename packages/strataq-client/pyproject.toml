[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strataq-client"
version = "0.1.0.dev0"
description = "Thin Python client for the strataq API."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Sharath Sathish" }]
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.urls]
Repository = "https://github.com/SharathSPhD/sage"

[tool.hatch.build.targets.wheel]
packages = ["strataq_client"]
